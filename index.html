function save(){localStorage.setItem('lix-v33',JSON.stringify(state))}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function game(){
 const completed=state.progress['1']||{}; let filled=new Set(completed.filled||[]); let current=state.progress['1']?.current||1;
 document.getElementById('app').innerHTML=`<div class="top"><button class="back" onclick="home()">← Back</button><div class="title">Macaw & Strawberry Garden</div><div class="coins">🪙 <b>${state.coins}</b></div></div><div class="wrap"><div class="panel progress"><div style="display:flex;justify-content:space-between"><b>Progress</b><b id="pct">0%</b></div><div class="bar"><div id="pfill" class="fill" style="width:0%"></div></div></div><div id="palette" class="palette"></div><div class="canvasWrap"><div class="art" id="art"><img src="lineart.png"><div id="svgbox"></div></div></div><div class="zoom"><button onclick="scale(-.1)">−</button><button onclick="scale(.1)">+</button></div><div class="hint" id="msg"></div><div class="done" id="done"><h2>🎉 Stage Complete!</h2><p>+500 Coins</p><button class="next" onclick="home()">Next Stage</button></div></div>`;

 function tap(id,num,p){if(filled.has(id))return;if(num!==current){document.getElementById('msg').textContent=`This region needs number ${num}.`;return}filled.add(id);p.setAttribute('fill',COLORS[num-1]); const r=REGION_DATA.find(x=>x.id===id); [...document.querySelectorAll('#svgbox text')].find(t=>Math.abs(+t.getAttribute('x')-r.cx)<.2&&Math.abs(+t.getAttribute('y')-r.cy)<.2)?.setAttribute('visibility','hidden'); let left=REGION_DATA.filter(x=>x.num===current&&!filled.has(x.id)).length; if(left===0 && current<12){current++;} state.progress['1']={filled:[...filled],current};save();renderPalette();update();if(filled.size===REGION_DATA.length){state.coins+=500;state.done['1']=true;save();document.getElementById('done').style.display='block';document.getElementById('msg').textContent='100% complete! Stage 2 unlocked.'}}
 function update(){let pct=Math.round(filled.size/REGION_DATA.length*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('pfill').style.width=pct+'%';let rem=REGION_DATA.filter(r=>r.num===current&&!filled.has(r.id)).length;document.getElementById('msg').textContent=rem?`Number ${current}: ${rem} regions remaining.`:'Choose another number.'}
