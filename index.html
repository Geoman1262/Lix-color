// V32 demo catalogs: Premium/Weekly use the same irregular-region engine; full catalogs can be expanded with licensed/original artwork.
const PREMIUM_DEMO=[{...ASSETS.find(a=>a.id===4),id:101,name:'Premium Detail · Aerial Landing',premium:true,entry:5000,base:5000}];
const WEEKLY_DEMO=[{...ASSETS.find(a=>a.id===2),id:201,name:'Weekly · Coastal Flight',weekly:true,entry:3000,base:4000}];
const KEY='lix-color-v32-state';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{coins:50,unlocked:1,completed:{},progress:{}};
let active=1,current=1,regions=[],asset=null,zoom=1;
const $=id=>document.getElementById(id); function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function renderHome(){
 $('coins').textContent=state.coins; $('gameCoins').textContent=state.coins; $('stageText').textContent=Math.min(state.unlocked,150); $('level').textContent=Math.max(1,Math.ceil(state.unlocked/5)); $('fill').style.width=Math.max(1,Math.min(100,state.unlocked/150*100))+'%';
 const cards=$('cards'); cards.innerHTML='';
 let list=ASSETS;
 if(window.__cat==='premium') list=PREMIUM_DEMO;
 if(window.__cat==='weekly') list=WEEKLY_DEMO;
 list.forEach(a=>{ const d=document.createElement('div');d.className='card';const p=document.createElement('div');p.className='pic';const im=document.createElement('img');im.src=a.photo;p.appendChild(im);
 if(a.premium){const b=document.createElement('div');b.className='premiumBadge';b.textContent='PREMIUM';p.appendChild(b)}
 if(a.weekly){const b=document.createElement('div');b.className='premiumBadge';b.textContent='WEEKLY';p.appendChild(b)}
 else if(!a.premium && a.id>state.unlocked){const l=document.createElement('div');l.className='lockbadge';l.textContent='🔒';p.appendChild(l)}
 d.appendChild(p);const m=document.createElement('div');m.className='meta';m.innerHTML='<div class="stage">'+(a.premium?'Premium':a.weekly?'Weekly':'Stage '+a.id)+'</div><div class="name">'+a.name+'</div>';d.appendChild(m);const b=document.createElement('button');
 if(a.premium){b.textContent='Entry · '+a.entry.toLocaleString()+' Coins';b.onclick=()=>openSpecial(a,'premium');}
 else if(a.weekly){b.textContent='Entry · 3,000 Coins';b.onclick=()=>openSpecial(a,'weekly');}
 else if(a.id<=state.unlocked){b.textContent=state.completed[a.id]?'Replay':'Play';b.onclick=()=>openStage(a.id);}
 else {b.textContent='Complete Stage '+(a.id-1);b.className='lock';}
 d.appendChild(b);cards.appendChild(d); });
}

function openSpecial(a,mode){
 if(mode==='premium'){
   if(!state.specialPaid) state.specialPaid={};
   if(!state.specialPaid.premium){ if(state.coins<a.entry){alert('Not enough Coins. Premium entry costs '+a.entry.toLocaleString()+'.');return;} state.coins-=a.entry; state.specialPaid.premium=true; save(); }
 }
 if(mode==='weekly'){
   if(!state.specialPaid) state.specialPaid={};
   if(!state.specialPaid.weekly){ if(state.coins<a.entry){alert('Not enough Coins. Weekly entry costs '+a.entry.toLocaleString()+'.');return;} state.coins-=a.entry; state.specialPaid.weekly=true; save(); }
 }
 active=a.id; asset=a; asset.__mode=mode; $('home').classList.add('hidden'); $('game').classList.remove('hidden'); build();
}
function openStage(id){active=id;asset=ASSETS.find(a=>a.id===id); if(!asset||asset.premium)return; asset.__mode='normal'; $('home').classList.add('hidden');$('game').classList.remove('hidden');build();}
function build(){current=1;zoom=1;if(asset.__mode==='normal') asset=ASSETS.find(a=>a.id===active)||asset;regions=asset.regions.regions;const saved=state.progress[active]?.revealed||[];const rev=new Set(saved);const svg=$('canvas');svg.innerHTML='';svg.setAttribute('viewBox','0 0 420 420');
 regions.forEach((r,i)=>{const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.classList.add('region');path.dataset.i=i;path.dataset.n=r.n;path.setAttribute('d',r.path);if(rev.has(i)){path.style.fill=asset.regions.palette[r.n-1];path.dataset.done='1';}path.addEventListener('click',()=>tap(i,path));svg.appendChild(path);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.classList.add('label');t.dataset.label=i;t.setAttribute('x',r.x);t.setAttribute('y',r.y);t.textContent=r.n;if(rev.has(i))t.classList.add('revealedLabel');svg.appendChild(t);});
 for(let n=1;n<=asset.regions.palette.length;n++){if(remaining(n)>0){current=n;break;}}renderNums();update();}
function remaining(n){return regions.filter((r,i)=>r.n===n&&!document.querySelector('[data-i="'+i+'"]').dataset.done).length;}
function renderNums(){const box=$('nums');box.innerHTML='';for(let n=1;n<=asset.regions.palette.length;n++){const b=document.createElement('button');b.className='num';b.id='num'+n;b.innerHTML=n+'<small>'+remaining(n)+'</small>';if(n===current)b.classList.add('active');if(remaining(n)===0)b.classList.add('done');b.onclick=()=>{ if(asset.__mode==='weekly' && remaining(n)>0){current=n;updateNums();update();$('info').textContent='Find all regions numbered '+n+'.';} else if(n===current){$('info').textContent='Find all regions numbered '+n+'.';} };box.appendChild(b);}}
function updateNums(){for(let n=1;n<=asset.regions.palette.length;n++){const b=$('num'+n);if(!b)continue;b.innerHTML=n+'<small>'+remaining(n)+'</small>';b.classList.toggle('active',n===current);b.classList.toggle('done',remaining(n)===0);}}
function tap(i,path){if(path.dataset.done)return;const n=+path.dataset.n;if(n!==current){path.classList.add('wrong');setTimeout(()=>path.classList.remove('wrong'),180);return;}path.dataset.done='1';path.style.fill=asset.regions.palette[n-1];const label=document.querySelector('[data-label="'+i+'"]');if(label)label.classList.add('revealedLabel');const arr=state.progress[active]?.revealed||[];arr.push(i);state.progress[active]={revealed:[...new Set(arr)]};save();if(remaining(n)===0){while(current<=asset.regions.palette.length&&remaining(current)===0)current++;}updateNums();update();if(regions.every((r,j)=>document.querySelector('[data-i="'+j+'"]').dataset.done))complete();}
function update(){const done=regions.length-regions.filter((r,i)=>!document.querySelector('[data-i="'+i+'"]').dataset.done).length;const pct=Math.round(done/regions.length*100);$('pct').textContent=pct+'%';$('pfill').style.width=pct+'%';$('gameTitle').textContent=asset.name+' · '+done+'/'+regions.length;$('gameCoins').textContent=state.coins;$('info').textContent=current<=asset.regions.palette.length?'Number '+current+': '+remaining(current)+' regions remaining.':'Picture complete!';}
function complete(){if(asset.__mode==='premium'){if(!state.completedPremium){state.completedPremium=true;state.coins+=6000;$('reward').textContent='+6,000 Coins (5,000 entry returned + 1,000 bonus).';}else $('reward').textContent='Premium replay: 0 Coins.';} else if(asset.__mode==='weekly'){if(!state.completedWeekly){state.completedWeekly=true;state.coins+=4000;$('reward').textContent='+4,000 Coins.';}else $('reward').textContent='Weekly replay: 0 Coins.';} else if(!state.completed[active]){state.completed[active]=true;state.coins+=50;state.unlocked=Math.max(state.unlocked,Math.min(150,active+1));delete state.progress[active];save();$('reward').textContent='+50 Coins · Stage '+(active+1)+' unlocked.';}else $('reward').textContent='Already completed. Replay has no first-completion bonus.';$('complete').classList.remove('hidden');renderHome();}
$('back').onclick=()=>{ $('game').classList.add('hidden');$('home').classList.remove('hidden');renderHome(); };
$('next').onclick=()=>{ if(asset.__mode==='normal' && active<ASSETS.length) openStage(active+1); else { $('game').classList.add('hidden');$('home').classList.remove('hidden');renderHome();} };
$('tabNormal').onclick=()=>{window.__cat='normal';$('tabNormal').classList.add('active');$('tabPremium').classList.remove('active');$('tabWeekly').classList.remove('active');renderHome();};$('tabPremium').onclick=()=>{if(state.unlocked<15){alert('Premium unlocks at Stage 15.');return;}window.__cat='premium';$('tabPremium').classList.add('active');$('tabNormal').classList.remove('active');$('tabWeekly').classList.remove('active');renderHome();};$('tabWeekly').onclick=()=>{if(state.unlocked<30){alert('Weekly unlocks at Stage 30.');return;}window.__cat='weekly';$('tabWeekly').classList.add('active');$('tabNormal').classList.remove('active');$('tabPremium').classList.remove('active');renderHome();};
$('zoomIn').onclick=()=>{zoom=Math.min(2.5,zoom+.15);$('canvas').style.transform='scale('+zoom+')';$('canvas').style.transformOrigin='center';};$('zoomOut').onclick=()=>{zoom=Math.max(1,zoom-.15);$('canvas').style.transform='scale('+zoom+')';};$('zoomReset').onclick=()=>{zoom=1;$('canvas').style.transform='scale(1)';};
window.__cat='normal';renderHome();
</script></body></html>
