<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lix Color — Real Shapes Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef5ff;color:#172033}
.app{max-width:760px;margin:auto;padding:14px}.top,.gameTop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:900}.coins{background:#fff;border:1px solid #dbe5f3;border-radius:18px;padding:8px 12px;font-weight:800}
button{font:inherit;cursor:pointer}.brush,.primary{border:0;border-radius:13px;padding:10px 13px;background:#172033;color:#fff;font-weight:900}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.tab{border:1px solid #d7e1ef;background:#fff;border-radius:13px;padding:11px;font-weight:800}.tab.active{background:#172033;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid #dce5f1;border-radius:18px;overflow:hidden}
.thumb{aspect-ratio:1.1;background:#f5f8fc;display:grid;place-items:center;position:relative}.thumb svg{width:94%;height:94%}
.meta{padding:10px}.title{font-weight:900}.sub{font-size:12px;color:#69758a;margin-top:3px}.badge,.lock{position:absolute;background:#fff;border:1px solid #dbe4ef;border-radius:10px;padding:5px 8px;font-weight:900}.badge{top:8px;left:8px}.lock{font-size:28px;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
.card.locked .thumb{opacity:.68}.card button{margin:0 10px 11px;width:calc(100% - 20px);border:0;border-radius:12px;padding:10px;font-weight:900;background:#eaf1fb;color:#172033}.card button.primary{background:#172033;color:#fff}
.gameTop{margin-bottom:10px}.back{border:0;background:#fff;border:1px solid #dbe4ef;border-radius:11px;padding:9px 12px;font-weight:900}
.numberBtns{display:flex;gap:6px;overflow:auto;padding:5px 0 10px}.num{min-width:42px;border:1px solid #d8e2ef;background:#fff;border-radius:10px;padding:8px;font-weight:900}.num.active{background:#172033;color:#fff}.num.done{background:#dff6e6}
.canvas{background:#fff;border:1px solid #dce5ef;border-radius:20px;padding:8px}.canvas svg{width:100%;display:block;touch-action:manipulation}
.region{stroke:#ffffff;stroke-width:1.2;cursor:pointer;transition:filter .12s}.region:hover{filter:brightness(.97)}
.region.done{stroke:#fff}.label{font-size:8px;font-weight:900;fill:#27344a;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.hint{text-align:center;color:#68748a;font-size:12px;margin:8px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 14px;border-radius:13px;font-weight:800;display:none;z-index:40}
@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app"></div><div class="toast" id="toast"></div>
<script>
const brush={m:1};
const pictureData={
  1:{
    title:"Flower",
    reward:60,
    regions:[
      {n:1,d:"M100 25 C84 18 69 29 72 46 C57 35 40 42 42 59 C28 55 20 67 29 80 C42 98 69 89 85 75 L100 60 Z",x:58,y:58},
      {n:1,d:"M100 25 C116 18 131 29 128 46 C143 35 160 42 158 59 C172 55 180 67 171 80 C158 98 131 89 115 75 L100 60 Z",x:142,y:58},
      {n:2,d:"M100 56 C82 42 60 51 61 71 C62 92 80 105 100 105 C120 105 138 92 139 71 C140 51 118 42 100 56 Z",x:100,y:76},
      {n:3,d:"M100 100 C91 112 85 130 84 151 L116 151 C115 130 109 112 100 100 Z",x:100,y:132},
      {n:4,d:"M84 146 C69 143 53 149 43 163 C59 164 74 164 89 162 Z",x:67,y:157},
      {n:4,d:"M116 146 C131 143 147 149 157 163 C141 164 126 164 111 162 Z",x:133,y:157},
      {n:5,d:"M87 151 C89 169 87 179 80 187 L100 187 L120 187 C113 179 111 169 113 151 Z",x:100,y:174}
    ]
  },
  2:{
    title:"Cute Cat",
    reward:90,
    regions:[
      {n:1,d:"M52 70 L42 25 L79 48 C92 42 108 42 121 48 L158 25 L148 70 C157 84 158 104 151 119 C142 138 122 147 100 147 C78 147 58 138 49 119 C42 104 43 84 52 70 Z",x:100,y:91},
      {n:2,d:"M42 25 L79 48 C68 51 57 58 52 70 Z",x:57,y:43},
      {n:2,d:"M158 25 L121 48 C132 51 143 58 148 70 Z",x:143,y:43},
      {n:3,d:"M64 84 C69 76 79 76 84 84 C79 92 69 92 64 84 Z",x:74,y:84},
      {n:3,d:"M116 84 C121 76 131 76 136 84 C131 92 121 92 116 84 Z",x:126,y:84},
      {n:4,d:"M94 101 Q100 96 106 101 L100 108 Z",x:100,y:102},
      {n:5,d:"M100 108 C92 111 91 119 100 124 C109 119 108 111 100 108 Z",x:100,y:117},
      {n:6,d:"M72 111 L42 104 M72 119 L38 121 M128 111 L158 104 M128 119 L162 121",x:100,y:115},
      {n:7,d:"M74 147 C79 159 87 166 100 168 C113 166 121 159 126 147 C116 152 84 152 74 147 Z",x:100,y:158}
    ]
  },
  3:{
    title:"Mountain Lake",
    reward:120,
    regions:[
      {n:1,d:"M18 139 L64 65 L94 104 L121 57 L181 139 Z",x:100,y:111},
      {n:2,d:"M64 65 L94 104 L83 119 L52 139 L18 139 Z",x:54,y:109},
      {n:3,d:"M121 57 L181 139 L113 139 L105 115 Z",x:143,y:110},
      {n:4,d:"M18 139 L181 139 L181 178 L18 178 Z",x:100,y:157},
      {n:5,d:"M18 139 L64 65 L71 76 L42 139 Z",x:39,y:115},
      {n:5,d:"M121 57 L181 139 L169 139 L132 86 Z",x:151,y:107},
      {n:6,d:"M18 139 Q50 129 82 139 T145 139 T181 139 L181 151 L18 151 Z",x:100,y:145}
    ]
  }
};
const state=JSON.parse(localStorage.getItem("lixColorV10")||"null")||{coins:0,stage:1,progress:{},completed:{}};
const save=()=>localStorage.setItem("lixColorV10",JSON.stringify(state));
const toast=x=>{const t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",1500)};
const colors={1:"#ffd54f",2:"#ff9f80",3:"#80cbc4",4:"#81d4fa",5:"#b39ddb",6:"#a5d6a7",7:"#f48fb1"};
function thumb(p){
  return `<svg viewBox="0 0 200 200">${p.regions.map(r=>`<path d="${r.d}" fill="#ffd54f" stroke="#fff" stroke-width="1"/>`).join("")}</svg>`;
}
function home(){
  let cards="";
  for(let i=1;i<=3;i++){let p=pictureData[i],locked=i>state.stage,done=!!state.completed["normal"+i];cards+=`<div class="card ${locked?"locked":""}"><div class="thumb">${thumb(p)}${locked?'<div class="lock">🔒</div>':""}${done?'<div class="badge">✓ Completed</div>':""}</div><div class="meta"><div class="title">Stage ${i} · ${p.title}</div><div class="sub">${locked?"Locked":"Reward "+p.reward+" Coins"}</div></div><button class="${locked?"":"primary"} data-i="${i}">${locked?"Locked":"Play"}</button></div>`}
  document.getElementById("app").innerHTML=`<div class="top"><div class="logo">Lix Color</div><div class="coins">🪙 ${state.coins}</div></div>
<div class="tabs">
<button class="tab active">Normal</button>
<button class="tab" onclick="showCategory('premium')">Premium</button>
<button class="tab" onclick="showCategory('weekly')">Weekly</button>
</div>
<div class="grid">${cards}</div>`;
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(i<=state.stage)start(i);else toast("Locked")});
}
function start(i){
  const p=pictureData[i],key="normal"+i,old=state.progress[key];
  const regions=old?old.regions:p.regions.map(r=>({...r,done:false}));
  draw({i,key,regions,current:old?.current||1});
}
function persist(g){state.progress[g.key]={regions:g.regions,current:g.current};save()}
function draw(g){
  const nums=[...new Set(g.regions.map(r=>r.n))].sort((a,b)=>a-b);
  const buttons=nums.map(n=>{const rem=g.regions.filter(r=>r.n===n&&!r.done).length;return `<button class="num ${g.current===n?"active":""} ${rem===0?"done":""}" data-n="${n}">${n}<small style="display:block">${rem}</small></button>`}).join("");
  const svg=g.regions.map((r,i)=>`<g><path class="region" d="${r.d}" fill="${r.done?colors[r.n]:"#e5ebf2"}" data-i="${i}" data-n="${r.n}"/><text class="label" x="${r.x}" y="${r.y}">${r.done?"":r.n}</text></g>`).join("");
  const done=g.regions.filter(r=>r.done).length;
  document.getElementById("app").innerHTML=`<div class="gameTop"><button class="back" id="back">← Back</button><b>${pictureData[g.i].title} · ${done}/${g.regions.length}</b><div class="coins">🪙 ${state.coins}</div></div><div class="numberBtns">${buttons}</div><div class="canvas"><svg viewBox="0 0 200 200" aria-label="${pictureData[g.i].title}">${svg}</svg></div><div class="hint">Finish number ${g.current}. Your progress is saved automatically.</div>`;
  document.getElementById("back").onclick=()=>{persist(g);home()};
  document.querySelectorAll(".num").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;if(n>g.current&&g.regions.some(r=>r.n===g.current&&!r.done))return toast("Finish the current number first");g.current=n;persist(g);draw(g)});
  document.querySelectorAll(".region").forEach(e=>e.onclick=()=>tap(g,+e.dataset.i,+e.dataset.n));
}
function tap(g,i,n){
  const r=g.regions[i];if(r.done)return;
  if(n!==g.current)return toast("Wrong number");
  r.done=true;persist(g);
  if(!g.regions.some(x=>x.n===g.current&&!x.done)){const next=g.regions.find(x=>!x.done)?.n;if(next)g.current=next}
  if(g.regions.every(x=>x.done))finish(g);else draw(g);
}
function finish(g){
  state.coins+=pictureData[g.i].reward;state.completed[g.key]=true;delete state.progress[g.key];
  if(g.i===state.stage)state.stage=Math.min(3,state.stage+1);save();home();toast("Completed! +"+pictureData[g.i].reward+" Coins");
}

function showCategory(cat){
  if(cat==="premium"){ renderPremium(); return; }
  if(cat==="weekly"){ renderWeekly(); return; }
}
function renderPremium(){
  const cards=[];
  for(let i=1;i<=20;i++){
    const open=state.stage>=15 && !!state.premiumOpened[i];
    const cost=[5000,7500,10000,12500,15000,20000,25000,30000,40000,50000,60000,75000,90000,110000,135000,165000,200000,250000,300000,400000][i-1];
    const unlocked=state.stage>=15;
    const p=pictureData[((i-1)%3)+1];
    cards.push(`<div class="card ${open?"":"locked"}"><div class="thumb">${thumb(p)}${!open?'<div class="lock">🔒</div>':""}</div><div class="meta"><div class="title">Premium ${i}</div><div class="sub">${!unlocked?"Unlocks at Stage 15":open?"Unlocked · Entry "+cost.toLocaleString():"Entry "+cost.toLocaleString()+" Coins"}</div></div><button class="${open?"primary":""}" data-prem="${i}">${open?"Play":unlocked?"Open":"Locked"}</button></div>`);
  }
  document.getElementById("app").innerHTML=`<div class="top"><div class="logo">Lix Color</div><div class="coins">🪙 ${state.coins}</div></div>
  <div class="tabs"><button class="tab" onclick="home()">Normal</button><button class="tab active">Premium</button><button class="tab" onclick="renderWeekly()">Weekly</button></div>
  <div class="grid">${cards.join("")}</div>`;
  document.querySelectorAll("[data-prem]").forEach(b=>b.onclick=()=>premiumClick(+b.dataset.prem));
}
function premiumClick(i){
  if(state.stage<15)return toast("Unlocks at Stage 15");
  const costs=[5000,7500,10000,12500,15000,20000,25000,30000,40000,50000,60000,75000,90000,110000,135000,165000,200000,250000,300000,400000];
  if(!state.premiumOpened[i]){
    if(state.coins<costs[i-1])return toast("Not enough Coins");
    state.coins-=costs[i-1];state.premiumOpened[i]=true;save();renderPremium();return;
  }
  start(i);
}
function renderWeekly(){
  const cards=[];
  for(let i=1;i<=52;i++){
    const current=i===1, open=current && state.stage>=30 && state.weeklyOpened;
    const locked=state.stage<30 || !current;
    const label=state.stage<30?"Unlocks at Stage 30":current?(state.weeklyOpened?"Unlocked · 3,000 Coins":"Entry 3,000 Coins"):`Week ${i} · Locked`;
    const p=pictureData[((i-1)%3)+1];
    cards.push(`<div class="card ${open?"":"locked"}"><div class="thumb">${thumb(p)}${!open?'<div class="lock">🔒</div>':""}</div><div class="meta"><div class="title">Weekly ${i}</div><div class="sub">${label}</div></div><button class="${open?"primary":""}" data-week="${i}">${open?"Play":(!locked&&current)?"Open":"Locked"}</button></div>`);
  }
  document.getElementById("app").innerHTML=`<div class="top"><div class="logo">Lix Color</div><div class="coins">🪙 ${state.coins}</div></div>
  <div class="tabs"><button class="tab" onclick="home()">Normal</button><button class="tab" onclick="renderPremium()">Premium</button><button class="tab active">Weekly</button></div>
  <div class="grid">${cards.join("")}</div>`;
  document.querySelectorAll("[data-week]").forEach(b=>b.onclick=()=>weeklyClick(+b.dataset.week));
}
function weeklyClick(i){
  if(state.stage<30)return toast("Unlocks at Stage 30");
  if(i!==1)return toast("This week is not available yet");
  if(!state.weeklyOpened){
    if(state.coins<3000)return toast("3,000 Coins required");
    state.coins-=3000;state.weeklyOpened=true;save();
  }
  startWeekly();
}
function startWeekly(){
  const key="weekly1",old=state.progress[key];
  const p=pictureData[3];
  const regions=old?old.regions:p.regions.map(r=>({...r,done:false}));
  drawWeekly({key,regions,current:old?.current||1});
}
function drawWeekly(g){
  const nums=[...new Set(g.regions.map(r=>r.n))].sort((a,b)=>a-b);
  const buttons=nums.map(n=>{const rem=g.regions.filter(r=>r.n===n&&!r.done).length;return `<button class="num ${g.current===n?"active":""} ${rem===0?"done":""}" data-n="${n}">${n}<small style="display:block">${rem}</small></button>`}).join("");
  const svg=g.regions.map((r,i)=>`<g><path class="region" d="${r.d}" fill="${r.done?colors[r.n]:"#e5ebf2"}" data-i="${i}" data-n="${r.n}"/><text class="label" x="${r.x}" y="${r.y}">${r.done?"":r.n}</text></g>`).join("");
  document.getElementById("app").innerHTML=`<div class="gameTop"><button class="back" id="back">← Back</button><b>Weekly · ${g.regions.filter(r=>r.done).length}/${g.regions.length}</b><div class="coins">🪙 ${state.coins}</div></div><div class="numberBtns">${buttons}</div><div class="canvas"><svg viewBox="0 0 200 200">${svg}</svg></div><div class="hint">Weekly: choose any number at any time. Progress saves automatically.</div>`;
  document.getElementById("back").onclick=()=>{persistWeekly(g);renderWeekly()};
  document.querySelectorAll(".num").forEach(b=>b.onclick=()=>{g.current=+b.dataset.n;persistWeekly(g);drawWeekly(g)});
  document.querySelectorAll(".region").forEach(e=>e.onclick=()=>tapWeekly(g,+e.dataset.i,+e.dataset.n));
}
function persistWeekly(g){state.progress[g.key]={regions:g.regions,current:g.current};save()}
function tapWeekly(g,i,n){
  const r=g.regions[i];if(r.done)return;if(n!==g.current)return toast("Wrong number");
  r.done=true;persistWeekly(g);
  if(g.regions.every(x=>x.done)){
    state.coins+=4000;state.completed[g.key]=true;delete state.progress[g.key];state.weeklyOpened=false;save();renderWeekly();toast("+4,000 Coins");return;
  }
  drawWeekly(g);
}

home();
</script>
</body></html>
