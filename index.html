<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Color by Number</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101522;color:white;min-height:100vh}
.header{padding:14px;display:flex;justify-content:space-between;align-items:center;background:#171e30;border-bottom:1px solid #293149}
.logo{font-size:21px;font-weight:800}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:#222b40;padding:7px 10px;border-radius:10px;font-size:12px}
.container{max-width:900px;margin:auto;padding:18px}
h1{text-align:center;margin:10px 0 5px}.subtitle{text-align:center;color:#9ba7bd;margin-bottom:20px}
.pictures{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.card{background:#1a2234;border:1px solid #2a3550;border-radius:16px;padding:12px;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#5c7cff}
.preview{height:120px;border-radius:12px;background:#303b55;display:flex;align-items:center;justify-content:center;font-size:55px}
.card h3{margin:10px 0 4px}.card p{margin:4px 0;color:#9ba7bd;font-size:13px}.reward{color:#ffd34d;font-weight:bold}
.hidden{display:none!important}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.back{background:#252f46;border:0;color:white;padding:10px 14px;border-radius:10px;cursor:pointer}
.number-info{text-align:center;flex:1}.active-number{font-size:28px;font-weight:900}.remaining{color:#aeb8cc;font-size:13px}
.progress{height:8px;background:#273148;border-radius:10px;overflow:hidden;margin:10px 0 16px}
.progress-bar{height:100%;width:0%;background:#6c82ff;transition:.2s}
.board{width:min(92vw,650px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(20,1fr);gap:2px;background:#080c14;padding:3px;border-radius:14px}
.cell{border-radius:2px;background:#d7dbe4;display:flex;align-items:center;justify-content:center;font-size:9px;color:#222;font-weight:bold;cursor:pointer;user-select:none;transition:.08s}
.cell:hover{transform:scale(.94)}.cell.done{cursor:default;color:transparent}.cell.locked{opacity:.65}
.brush-box{margin-top:18px;background:#1a2234;padding:15px;border-radius:15px}
.brush-title{display:flex;justify-content:space-between}
.upgrade{width:100%;margin-top:10px;padding:12px;border:0;border-radius:11px;background:#6078ff;color:white;font-weight:bold;cursor:pointer}
.upgrade:disabled{opacity:.4;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{width:min(400px,100%);background:#1a2234;border-radius:20px;padding:25px;text-align:center}
.big-reward{font-size:40px;color:#ffd34d;font-weight:900;margin:15px}
.close{border:0;background:#6078ff;color:white;padding:12px 30px;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<header class="header">
<div class="logo">🎨 Color by Number</div>
<div class="stats">
<div class="stat">🪙 <span id="coins">0</span></div>
<div class="stat">⭐ Level <span id="playerLevel">1</span></div>
<div class="stat">🖌️ Brush <span id="brushLevel">1</span> ×<span id="multiplier">1.0</span></div>
</div>
</header>

<div class="container">
<section id="home">
<h1>Choose a Picture</h1>
<div class="subtitle">Complete every number to finish the picture.</div>
<div class="pictures" id="pictures"></div>
<div class="brush-box">
<div class="brush-title"><strong>🖌️ Brush Power</strong><span>Level <span id="brushLevelHome">1</span></span></div>
<p>Reward multiplier: <strong>×<span id="multiplierHome">1.0</span></strong></p>
<button class="upgrade" id="upgradeHome" onclick="upgradeBrush()">Upgrade Brush</button>
</div>
</section>

<section id="game" class="hidden">
<div class="game-top">
<button class="back" onclick="goHome()">← Back</button>
<div class="number-info">
<div>Number <span class="active-number" id="activeNumber">1</span></div>
<div class="remaining">Remaining: <strong id="remaining">0</strong></div>
</div>
</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="board" id="board"></div>
<div class="brush-box">
<div class="brush-title"><strong>🖌️ Brush</strong><span>Level <span id="brushGame">1</span> ×<span id="multiplierGame">1.0</span></span></div>
<button class="upgrade" onclick="upgradeBrush()" id="upgradeGame">Upgrade Brush</button>
</div>
</section>
</div>

<div id="rewardModal" class="modal hidden">
<div class="modal-box">
<h2>🎉 Picture Complete!</h2>
<div class="big-reward">+<span id="rewardAmount">0</span> 🪙</div>
<p>Your Brush multiplier was applied.</p>
<button class="close" onclick="closeReward()">Continue</button>
</div>
</div>

<script>
let player=JSON.parse(localStorage.getItem("colorNumberPlayer"))||{coins:0,level:1,brushLevel:1,completed:[]};

const multipliers=[1.0,1.1,1.5,1.9,2.3,2.7,3.1,3.5,3.9,4.3];
const brushCosts=[0,300,1000,2500,6000,15000,40000,100000,250000,700000];

const pictures=[
{id:"flower",name:"Flower",stage:1,groups:8,reward:40,icon:"🌸"},
{id:"sunset",name:"Sunset",stage:2,groups:20,reward:90,icon:"🌅"},
{id:"lion",name:"Lion",stage:3,groups:50,reward:180,icon:"🦁"},
{id:"city",name:"City",stage:4,groups:100,reward:350,icon:"🌆"},
{id:"masterpiece",name:"Masterpiece",stage:5,groups:200,reward:700,icon:"🎨"}
];

let currentPicture=null,currentNumber=1,counts={},originalCounts={},totalCells=400;

function multiplier(){return multipliers[player.brushLevel-1]}
function save(){localStorage.setItem("colorNumberPlayer",JSON.stringify(player))}

function renderPictures(){
const container=document.getElementById("pictures");container.innerHTML="";
pictures.forEach(pic=>{
const card=document.createElement("div");card.className="card";
card.innerHTML=`<div class="preview">${pic.icon}</div><h3>${pic.name}</h3><p>Stage ${pic.stage}</p><p>${pic.groups} numbers</p><p class="reward">Base Reward: ${pic.reward} 🪙</p>`;
card.onclick=()=>startGame(pic);container.appendChild(card);
})}

function goHome(){
document.getElementById("game").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
renderUI();
}

function startGame(pic){
currentPicture=pic;currentNumber=1;counts={};originalCounts={};
createNumberCounts();
document.getElementById("home").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");
createBoard();updateGameUI();
}

function createNumberCounts(){
let remaining=totalCells;
for(let n=1;n<=currentPicture.groups;n++){
const numbersLeft=currentPicture.groups-n+1;
let count=n===currentPicture.groups?remaining:Math.max(1,Math.floor(remaining/numbersLeft));
counts[n]=count;remaining-=count;
}
originalCounts={...counts};
}

function createBoard(){
const board=document.getElementById("board");board.innerHTML="";
let cells=[];
for(let number=1;number<=currentPicture.groups;number++)
for(let i=0;i<counts[number];i++)cells.push(number);

for(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}

cells.forEach((number,index)=>{
const cell=document.createElement("div");
cell.className="cell";cell.textContent=number;
cell.dataset.number=number;cell.dataset.index=index;
cell.onclick=()=>clickCell(cell);board.appendChild(cell);
});
}

function clickCell(cell){
const number=Number(cell.dataset.number);
if(number!==currentNumber){
cell.classList.add("locked");setTimeout(()=>cell.classList.remove("locked"),180);return;
}
if(cell.classList.contains("done"))return;
cell.classList.add("done");cell.textContent="";
counts[currentNumber]--;updateGameUI();

if(counts[currentNumber]<=0){
if(currentNumber>=currentPicture.groups)completePicture();
else{currentNumber++;updateGameUI();}
}
}

function updateGameUI(){
document.getElementById("activeNumber").textContent=currentNumber;
document.getElementById("remaining").textContent=counts[currentNumber]||0;
const total=originalCounts[currentNumber]||1;
const done=total-(counts[currentNumber]||0);
document.getElementById("progressBar").style.width=Math.min(100,done/total*100)+"%";
}

function completePicture(){
const reward=Math.floor(currentPicture.reward*multiplier());
player.coins+=reward;
player.level=Math.max(player.level,currentPicture.stage+1);
if(!player.completed.includes(currentPicture.id))player.completed.push(currentPicture.id);
save();
document.getElementById("rewardAmount").textContent=reward;
document.getElementById("rewardModal").classList.remove("hidden");
renderUI();
}

function closeReward(){
document.getElementById("rewardModal").classList.add("hidden");
goHome();
}

function upgradeBrush(){
if(player.brushLevel>=10){alert("Brush is already MAX level!");return}
const next=player.brushLevel+1;
const cost=brushCosts[next-1];
if(player.coins<cost){alert("You need "+cost.toLocaleString()+" Coins.");return}
player.coins-=cost;player.brushLevel=next;save();renderUI();
}

function renderUI(){
const mult=multiplier();
document.getElementById("coins").textContent=player.coins.toLocaleString();
document.getElementById("playerLevel").textContent=player.level;
document.getElementById("brushLevel").textContent=player.brushLevel;
document.getElementById("multiplier").textContent=mult.toFixed(1);
document.getElementById("brushLevelHome").textContent=player.brushLevel;
document.getElementById("multiplierHome").textContent=mult.toFixed(1);
document.getElementById("brushGame").textContent=player.brushLevel;
document.getElementById("multiplierGame").textContent=mult.toFixed(1);
updateUpgradeButton("upgradeHome");updateUpgradeButton("upgradeGame");
}

function updateUpgradeButton(id){
const button=document.getElementById(id);if(!button)return;
if(player.brushLevel>=10){button.textContent="MAX LEVEL";button.disabled=true;return}
const next=player.brushLevel+1,cost=brushCosts[next-1];
button.textContent=`Upgrade → Level ${next} • ${cost.toLocaleString()} 🪙`;
button.disabled=player.coins<cost;
}

renderPictures();renderUI();
</script>
</body>
</html>
