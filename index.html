<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lix Color</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef5ff;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;cursor:pointer}.app{max-width:820px;margin:auto;padding:14px}
.top{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}.brand{font-size:27px;font-weight:950}.coins{background:#fff;border:1px solid #d9e3ef;border-radius:18px;padding:9px 13px;font-weight:900}
.player{grid-column:1/-1;background:#fff;border:1px solid #d9e3ef;border-radius:16px;padding:10px 12px;display:flex;gap:12px;align-items:center;justify-content:space-between}.xp{height:7px;background:#e5edf6;border-radius:8px;overflow:hidden;margin-top:5px}.xp i{display:block;height:100%;background:#172033}
.brushBtn{grid-column:1/-1;border:1px solid #d9e3ef;background:#fff;border-radius:15px;padding:11px 13px;text-align:left;font-weight:900}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tab{border:1px solid #d5dfeb;background:#fff;border-radius:14px;padding:12px 6px;font-weight:900}.tab.active{background:#172033;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid #dbe4ef;border-radius:17px;overflow:hidden;min-width:0}.thumb{aspect-ratio:1;position:relative;background:#f6f8fb;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.card.locked .thumb img{opacity:.62}.lock{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;text-shadow:0 2px 5px #fff}.badge{position:absolute;top:6px;left:6px;background:#fff;border:1px solid #dbe4ef;border-radius:9px;padding:4px 6px;font-weight:900;font-size:10px}.meta{padding:8px 9px 5px}.title{font-weight:950;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:#667389;margin-top:3px;min-height:27px}.cardBtn{width:calc(100% - 14px);margin:0 7px 7px;border:0;border-radius:11px;padding:9px 4px;font-weight:950;background:#e6edf6;color:#172033;font-size:12px}.cardBtn.open{background:#172033;color:#fff}
.overlay{position:fixed;inset:0;background:#081020aa;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal{background:#fff;border-radius:20px;width:min(700px,100%);max-height:92vh;overflow:auto;padding:16px}.modalHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.close{border:0;background:#edf2f7;border-radius:11px;padding:9px 12px;font-weight:900}.levels{display:grid;gap:8px;margin-top:10px}.level{border:1px solid #dbe4ef;border-radius:14px;padding:11px;display:flex;justify-content:space-between;align-items:center}.level.locked{opacity:.52}.level button{border:0;background:#172033;color:#fff;border-radius:10px;padding:8px 10px;font-weight:900}
.gameHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.back{border:1px solid #dbe4ef;background:#fff;border-radius:11px;padding:9px 12px;font-weight:900}.count{font-weight:950}
.numbar{display:flex;gap:6px;overflow:auto;padding:4px 0 10px}.num{min-width:44px;border:1px solid #d6e0ec;background:#fff;border-radius:10px;padding:7px 4px;font-weight:950}.num.active{background:#172033;color:#fff}.num.done{background:#dff5e5}
.board{background:#fff;border:1px solid #dbe4ef;border-radius:20px;padding:7px;position:relative}.board{overflow:hidden}.mosaic{display:grid;width:100%;aspect-ratio:1/1;gap:0;background:#fff;border-radius:14px;overflow:hidden}.tile{position:relative;border:0;border-right:1px solid #d8dde5;border-bottom:1px solid #d8dde5;background:#fff;display:grid;place-items:center;padding:0;color:#172033;font-weight:900;font-size:clamp(7px,2.2vw,15px);line-height:1;user-select:none;-webkit-tap-highlight-color:transparent}.tile:last-child{border-right:0}.tile.done{color:transparent;border-color:rgba(255,255,255,.28)}.tile.done::after{display:none}.tile span{position:relative;z-index:2;background:rgba(255,255,255,.92);border-radius:4px;padding:2px 3px;min-width:14px;text-align:center}.tile.done span{display:none}.hint{text-align:center;color:#667389;font-size:12px;padding:9px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#172033;color:#fff;border-radius:13px;padding:10px 14px;font-weight:850;display:none;z-index:100;white-space:nowrap}
@media(max-width:500px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.app{padding:10px}.brand{font-size:24px}.title{font-size:12px}.sub{font-size:9px}.cardBtn{font-size:11px}}
</style></head><body><div id="app" class="app"></div><div id="overlay" class="overlay"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div><script>
const BRUSH=[
 {l:1,m:1,u:1,c:0},{l:2,m:1.1,u:5,c:500},{l:3,m:1.5,u:12,c:2500},{l:4,m:1.9,u:19,c:7500},{l:5,m:2.3,u:26,c:20000},
 {l:6,m:2.7,u:33,c:50000},{l:7,m:3.1,u:40,c:125000},{l:8,m:3.5,u:47,c:300000},{l:9,m:3.9,u:54,c:750000},{l:10,m:4.3,u:61,c:1800000}
];
const PREMIUM=[5000,7500,10000,12500,15000,20000,25000,30000,40000,50000,60000,75000,90000,110000,135000,165000,200000,250000,300000,400000];
const normalNames=["Quiet Cat","Golden Retriever","Red Fox","Wild Horse","Snow Leopard","Little Panda","Green Parrot","White Owl","Butterfly Garden","Sunflower Field","Pink Rose","Purple Lavender","Red Tulip","Wild Daisy","Blue Hydrangea","Tropical Bird","Sea Turtle","Dolphin Coast","Whale Ocean","Coral Reef","Mountain Lake","Alpine Valley","Waterfall Trail","Forest Morning","Autumn Forest","Pine Woods","Misty Hills","Green Valley","Desert Sunset","Rocky Canyon","Golden Beach","Blue Lagoon","Island Coast","Ocean Waves","Cliffside Sea","Rainforest","Bamboo Forest","Cherry Blossom","Japanese Garden","Palm Beach","Northern Lights","Starry Night","Moonlit Lake","Sunrise Valley","Sunset Mountains","Cloudy Peaks","River Valley","Wooden Bridge","Old Village","City Lights","Paris Street","London Rain","Venice Canal","Coastal Town","Mountain Village","Farm Morning","Country Road","Lavender Farm","Wheat Field","Apple Orchard","Orange Grove","Lemon Garden","Coffee Plantation","Tea Hills","Tropical Waterfall","Jungle River","Safari Sunset","African Elephant","Lion Portrait","Giraffe Plains","Zebra Valley","Koala Tree","Kangaroo Land","Penguin Coast","Polar Bear","Arctic Ice","Glacier Bay","Iceland Waterfall","Volcanic Island","Cliff Cave","Canyon River","Red Rock","Stone Arch","Desert Dunes","Palm Oasis","Blue Grotto","Sea Cave","Rock Pool","Sandy Shore","Shell Beach","Seashells","Morning Dew","Forest Flowers","Wild Mushrooms","Green Leaves","Maple Leaves","Autumn Road","Snowy Road","Winter Cabin","Cozy Cabin","Lake Cabin","Wooden House","Village Church","Old Castle","Stone Castle","Medieval Street","Golden Temple","Ancient Gate","Temple Garden","Bamboo Bridge","Rice Fields","Tea Garden","Fishing Village","Harbor Boats","Lighthouse","Sailing Boats","Blue Harbor","Marina Sunset","Beach Hut","Tropical Island","Palm Sunset","Ocean Cliff","Wild Coast","Seaside Rocks","Spring Meadow","Summer Meadow","Golden Meadow","Purple Field","Red Poppies","Blue Flowers","White Flowers","Flower Macro","Garden Path","Rose Garden","Botanical Garden","Greenhouse","Cactus Garden","Succulent Garden","Orchid Bloom","Lotus Pond","Water Lily","Bee on Flower","Hummingbird","Colorful Macaw","Kingfisher","Flamingo Lake","Peacock Garden","Deer Forest","Rabbit Meadow","Squirrel Tree"];
const premiumNames=["Aurora Kingdom","Crystal Cave","Heavenly Waterfall","Luxury Island","Royal Tiger","Sakura Palace","Milky Way Mountain","Emerald Lagoon","Golden Desert","Ice Palace","Enchanted Forest","Ocean Cathedral","African Sunset","Volcanic Paradise","Alpine Castle","Moonlit Venice","Rainbow Waterfall","Secret Garden","Firefly Forest","Dream Island"];
const weeklyNames=["Cherry Blossom Lake","Golden Retriever Beach","Mountain Cabin","Tropical Waterfall","Red Fox Snow","Blue Lagoon","Lavender Hills","Whale Ocean","Autumn Forest","Penguin Coast","Desert Caravan","Misty Waterfall","Peacock Garden","Sailing Sunset","Bamboo Forest","Alpine Lake","Coral Reef","Snowy Village","Lotus Pond","Safari Giraffe","Coastal Lighthouse","Wild Horses","Green Valley","Northern Lights","Golden Wheat","Water Lily","Rainforest River","Castle Valley","Blue Hour City","Palm Beach","Eagle Mountain","Rose Garden","Glacier Lake","Seaside Village","Hummingbird Flower","Moonlit Desert","River Bridge","Orchid Bloom","Canyon River","Lake Swan","Volcano Island","Forest Deer","Tropical Birds","Rocky Coast","Sunflower Field","Snow Leopard","Ancient Temple","Butterfly Meadow","Ocean Cliff","Autumn Cabin","Rainbow Mountains","Hidden Beach"];
const premiumQueries=["aurora northern lights mountains lake","crystal cave turquoise underground lake","epic waterfall tropical paradise","luxury tropical island turquoise ocean","tiger portrait jungle cinematic","japanese sakura palace spring","milky way mountains night landscape","emerald lagoon tropical cliffs","golden desert dunes sunset","iceberg glacier blue ice dramatic","enchanted forest sunlight mist","giant sea cliffs turquoise ocean","elephant safari sunset savanna","volcano tropical island dramatic","castle alpine mountains lake","venice canal moonlight cinematic","rainbow waterfall jungle","luxury botanical garden flowers","fireflies forest night magical","dream island aerial turquoise water"];
const weeklyQueries=["cherry blossom lake spring","golden retriever beach","mountain cabin sunrise","tropical waterfall jungle","red fox snow forest","blue lagoon tropical","lavender field hills","whale ocean sunset","autumn forest road","penguins antarctica coast","desert camel caravan","misty waterfall forest","peacock garden flowers","sailing boat sunset","bamboo forest japan","alpine lake mountains","coral reef underwater","snowy village mountains","lotus pond morning","giraffe safari sunset","lighthouse rocky coast","wild horses meadow","green valley mountains","northern lights lake","golden wheat field sunset","water lily pond","rainforest river aerial","castle valley europe","city skyline blue hour","palm beach turquoise water","eagle mountain sky","rose garden macro","glacier lake mountains","seaside village colorful","hummingbird flower closeup","moonlit desert dunes","stone bridge river forest","orchid flower macro","canyon river aerial","swan lake sunrise","volcano island ocean","deer forest morning","colorful tropical birds","rocky coast waves","sunflower field sunset","snow leopard mountains","ancient temple garden","butterfly meadow flowers","ocean cliff dramatic waves","autumn cabin forest","rainbow mountains landscape","hidden beach turquoise water"];
function photoFor(cat,i){
 const idx=i-1;
 const name=cat==='normal'?normalNames[idx]:(cat==='premium'?premiumNames[idx]:weeklyNames[idx]);
 const q=cat==='normal'?name.toLowerCase():(cat==='premium'?premiumQueries[idx]:weeklyQueries[idx]);
 const url='https://loremflickr.com/700/700/'+encodeURIComponent(q)+'?lock='+(idx+1+(cat==='premium'?500:cat==='weekly'?1000:0));
 return {title:name,url,query:q,reward:normalReward(i)};
}
function normalReward(i){
 const bands=[[1,5,50,90],[6,10,100,150],[11,20,165,300],[21,30,320,500],[31,40,525,750],[41,50,780,1050],[51,60,1100,1400],[61,70,1450,1800],[71,80,1850,2250],[81,90,2300,2750],[91,100,2800,3300],[101,110,3350,3900],[111,120,3950,4600],[121,130,4650,5400],[131,140,5450,6300],[141,150,6350,7300]];
 for(const [a,b,x,y] of bands)if(i>=a&&i<=b)return Math.round(x+(y-x)*(i-a)/(b-a||1));return 50;
}
const S=JSON.parse(localStorage.getItem('lixColorV16')||'null')||{coins:0,stage:1,level:1,brush:1,completed:{},progress:{},premiumOpened:{},weekly:{opened:false,done:false}};
const save=()=>localStorage.setItem('lixColorV16',JSON.stringify(S)),fmt=n=>Math.round(n).toLocaleString();
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',1700)}
function head(){let b=BRUSH[S.brush-1];return `<div class="top"><div class="brand">Lix Color</div><div class="coins">🪙 ${fmt(S.coins)}</div><div class="player"><div style="flex:1"><b>Player Level ${S.level}</b><div class="xp"><i style="width:${Math.min(100,(S.stage/150)*100)}%"></i></div><small>Stage ${S.stage} / 150</small></div><div>🖌️ Lv.${S.brush}<br><small>×${b.m}</small></div></div><button class="brushBtn" id="brushBtn">🖌️ Brush Level ${S.brush} · Reward ×${b.m}<span style="float:right">Upgrade ›</span></button></div>`}
function card(cat,i){
 const p=photoFor(cat,i),key=cat+i,done=!!S.completed[key];let open=false,sub='',act='Locked';
 if(cat==='normal'){open=i<=S.stage;sub=open?(i<S.stage?'Completed':'Reward '+fmt(p.reward)+' Coins'):'Complete Stage '+(i-1);act=open?'Play':'Locked'}
 if(cat==='premium'){open=!!S.premiumOpened[i];sub=S.stage<15?'Unlocks at Stage 15':open?'Unlocked · Entry '+fmt(PREMIUM[i-1]):'Entry '+fmt(PREMIUM[i-1])+' Coins';act=open?'Play':S.stage>=15?'Open':'Locked'}
 if(cat==='weekly'){open=i===1&&S.weekly.opened;sub=S.stage<30?'Unlocks at Stage 30':i===1?(open?'Opened · 3,000 Coins':'3,000 Coins to open'):'Future Week';act=open?'Play':i===1&&S.stage>=30?'Open':'Locked'}
 return `<div class="card ${open?'':'locked'}"><div class="thumb"><img loading="lazy" src="${p.url}" alt="${p.title}" onerror="this.style.background='#eef2f6'">${!open?'<div class="lock">🔒</div>':''}${done?'<div class="badge">✓</div>':''}</div><div class="meta"><div class="title">Stage ${cat==='normal'?i:cat==='premium'?i:i}</div><div class="sub">${p.title}</div><div class="sub">${sub}</div></div><button class="cardBtn ${open?'open':''}" data-cat="${cat}" data-id="${i}">${act}</button></div>`
}
function home(cat='normal'){
 let max=cat==='normal'?150:cat==='premium'?20:52,html='';for(let i=1;i<=max;i++)html+=card(cat,i);
 document.getElementById('app').innerHTML=head()+`<div class="tabs"><button class="tab ${cat==='normal'?'active':''}" data-tab="normal">Normal</button><button class="tab ${cat==='premium'?'active':''}" data-tab="premium">Premium</button><button class="tab ${cat==='weekly'?'active':''}" data-tab="weekly">Weekly</button></div><div class="grid">${html}</div>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>home(b.dataset.tab));document.getElementById('brushBtn').onclick=openBrush;
}
document.getElementById('app').addEventListener('click',e=>{let b=e.target.closest('[data-cat]');if(b)action(b.dataset.cat,+b.dataset.id)});
function action(cat,i){
 if(cat==='normal'){if(i>S.stage)return toast('Locked');return start(cat,i)}
 if(cat==='premium'){if(S.stage<15)return toast('Premium unlocks at Stage 15');if(!S.premiumOpened[i]){let c=PREMIUM[i-1];if(S.coins<c)return toast('Not enough Coins');S.coins-=c;S.premiumOpened[i]=true;save();home('premium');return}return start(cat,i)}
 if(S.stage<30)return toast('Weekly unlocks at Stage 30');if(i!==1)return toast('Future week is locked');if(!S.weekly.opened){if(S.coins<3000)return toast('3,000 Coins required');S.coins-=3000;S.weekly.opened=true;save()}start(cat,1)
}
function openBrush(){document.getElementById('modal').innerHTML=`<div class="modalHead"><div><h2 style="margin:0">Brush Upgrade</h2><small>Multiplier affects first completion reward only.</small></div><button class="close" id="close">Close</button></div><div class="levels">${BRUSH.map(b=>`<div class="level ${S.brush<b.l?'locked':''}"><div><b>Level ${b.l}</b> · ×${b.m}<br><small>Unlock Stage ${b.u} · ${b.c?fmt(b.c)+' Coins':'Free'}</small></div><button data-buy="${b.l}">${S.brush>=b.l?'Owned':S.stage<b.u?'Locked':'Buy'}</button></div>`).join('')}</div>`;document.getElementById('overlay').style.display='flex';document.getElementById('close').onclick=closeModal;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyBrush(+b.dataset.buy))}
function closeModal(){document.getElementById('overlay').style.display='none'}document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};
function buyBrush(l){let b=BRUSH[l-1];if(l<=S.brush||S.stage<b.u)return;if(S.coins<b.c)return toast('Not enough Coins');S.coins-=b.c;S.brush=l;save();closeModal();home();toast('Brush upgraded')}

// V15 mosaic engine: white contiguous square tiles. The source photo is hidden until a tile is correctly painted.
const PUZZLES={};
function puzzleConfig(cat){return cat==='weekly'?{n:25,groups:300}:{n:15,groups:75}}
function getPuzzle(cat,id){const key=cat+id;if(PUZZLES[key])return PUZZLES[key];const cfg=puzzleConfig(cat),p=photoFor(cat,id),cells=[];let idx=0;
 for(let y=0;y<cfg.n;y++)for(let x=0;x<cfg.n;x++){ // deterministic color-number pattern; same number can appear in multiple tiles
   let num=(idx%cfg.groups)+1;
   // mix the sequence so adjacent tiles don't all share the same number
   num=((x*17+y*31+id*7)%cfg.groups)+1;
   cells.push({i:idx,x,y,n:num});idx++;
 }
 const pu={...cfg,p,cells};PUZZLES[key]=pu;return pu}
function start(cat,id){const pu=getPuzzle(cat,id),key=cat+id,old=S.progress[key]||{done:[],current:1};drawGame({cat,id,key,pu,done:[...(old.done||[])],current:old.current||1})}
const COLOR_SETS={
 normal:['#F7F7F2','#DCEAF5','#B9D5E8','#8DB7D0','#5D91AE','#3F6F88','#244B63','#7A9FAF','#AFC6CF','#D7C7A7','#E8E2D2','#FFFFFF'],
 premium:['#FFFDF8','#F5E6C8','#E7C27E','#D9A04E','#B96F2B','#8B3F26','#5B2B5A','#315C7A','#3B7D62','#8BAA4E','#D85B83','#FFFFFF'],
 weekly:['#F8FBFF','#DCEAF5','#B9D5E8','#8DB7D0','#5D91AE','#3F6F88','#244B63','#7A9FAF','#B8C8A4','#D6D2A8','#8B806C','#FFFFFF']
};
function tileColor(cat,n){return COLOR_SETS[cat][n-1]||'#FFFFFF'}
function drawGame(g){
 const remaining=g.pu.cells.filter(c=>!g.done.includes(c.i)).length;
 const nums=[...new Set(g.pu.cells.map(c=>c.n))].sort((a,b)=>a-b);
 const ns=nums.map(n=>{let rem=g.pu.cells.filter(c=>c.n===n&&!g.done.includes(c.i)).length;return `<button class="num ${g.current===n?'active':''} ${rem===0?'done':''}" data-num="${n}">${n}<small style="display:block">${rem}</small></button>`}).join('');
 const tiles=g.pu.cells.map(c=>`<button class="tile ${g.done.includes(c.i)?'done':''}" style="${g.done.includes(c.i)?'background:'+tileColor(g.cat,c.n):'background:#fff'}" data-tile="${c.i}"><span>${c.n}</span></button>`).join('');
 document.getElementById('app').innerHTML=`<div class="gameHead"><button class="back" id="gb">← Back</button><div class="count">${g.p.title} · ${g.pu.cells.length-remaining}/${g.pu.cells.length}</div><div class="coins">🪙 ${fmt(S.coins)}</div></div><div class="numbar">${ns}</div><div class="board"><div class="mosaic" style="grid-template-columns:repeat(${g.pu.n},1fr)">${tiles}</div></div><div class="hint">Number ${g.current}: tap the matching squares. Progress saves automatically.</div>`;
 document.getElementById('gb').onclick=()=>{persist(g);home(g.cat)};
 document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{const c=g.pu.cells[+b.dataset.tile];tap(g,c)});
 document.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{let n=+b.dataset.num;if(g.cat!=='weekly'&&n>g.current)return toast('Finish the current number first');g.current=n;persist(g);drawGame(g)});
}
function persist(g){S.progress[g.key]={done:g.done,current:g.current};save()}
function tap(g,c){if(g.done.includes(c.i))return;if(c.n!==g.current)return toast('Wrong number');g.done.push(c.i);persist(g);let rem=g.pu.cells.filter(x=>x.n===g.current&&!g.done.includes(x.i)).length;if(rem===0&&g.cat!=='weekly'){let nx=g.pu.cells.find(x=>!g.done.includes(x.i))?.n;if(nx)g.current=nx}if(g.pu.cells.every(x=>g.done.includes(x.i))){finish(g);return}drawGame(g)}
function finish(g){
 let first=!S.completed[g.key],gain=0,m=BRUSH[S.brush-1].m;
 if(g.cat==='normal')gain=first?Math.round(g.p.reward*m):Math.round(g.p.reward*.02);
 else if(g.cat==='premium'){if(!first)return;let e=PREMIUM[g.id-1];gain=e+Math.round(e*.2*m)}
 else if(g.cat==='weekly'){if(!first)return;gain=Math.round(4000*m);S.weekly.opened=false}
 S.coins+=gain;S.completed[g.key]=true;delete S.progress[g.key];if(g.cat==='normal'&&g.id===S.stage)S.stage=Math.min(150,S.stage+1);S.level=Math.max(1,Math.floor((S.stage-1)/5)+1);save();home(g.cat);toast('Completed! +'+fmt(gain)+' Coins')
}
home();
</script></body></html>
