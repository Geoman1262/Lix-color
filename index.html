<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Color by Number</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f8;color:#111827}
    button{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}
    .game{max-width:1100px;margin:auto;padding:24px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:20px}
    .header h1{margin:0;font-size:32px}
    .header p{margin:8px 0;color:#667085}
    .coins{background:#111827;color:#fff;padding:14px 22px;border-radius:999px;font-weight:800}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}
    .stat,.brush,.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px}
    .stat{padding:18px}.stat span{display:block;color:#667085;font-size:13px}.stat strong{display:block;font-size:25px;margin-top:6px}
    .brush{display:flex;align-items:center;gap:20px;padding:22px}.brush-icon{font-size:55px}.brush-content{flex:1}
    .brush-content h2{margin:0}.brush-content p{color:#667085}.upgrade,.complete{background:#111827;color:#fff}
    .title{margin-top:35px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .card{padding:14px}.preview{height:190px;border-radius:14px;background:linear-gradient(135deg,#dbeafe,#fce7f3);display:flex;align-items:center;justify-content:center}
    .numbers{width:90%;display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.numbers span{width:29px;height:29px;display:grid;place-items:center;background:rgba(255,255,255,.85);border-radius:8px;font-size:11px;font-weight:800}
    .card h3{margin:14px 0 5px}.card p{color:#667085;margin:0 0 12px}.reward{font-weight:800;font-size:18px;margin-bottom:12px}.complete{width:100%}
    .done{font-weight:800;padding:12px 0}.footer{text-align:center;color:#98a2b3;padding:35px 0}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.game{padding:16px}.header{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  const KEY="color-by-number-game-v3";

  const DEFAULT={
    playerLevel:1,
    brushLevel:1,
    coins:0,
    completedImages:[]
  };

  const IMAGES=[
    {id:1,name:"Starter Flower",stage:1,baseReward:25,colors:5},
    {id:2,name:"Little House",stage:2,baseReward:45,colors:10},
    {id:3,name:"Sunset",stage:3,baseReward:70,colors:20},
    {id:4,name:"Forest",stage:4,baseReward:110,colors:40},
    {id:5,name:"City",stage:5,baseReward:170,colors:75}
  ];

  const BRUSH={
    1:{multiplier:1.0,cost:0},
    2:{multiplier:1.1,cost:300},
    3:{multiplier:1.5,cost:1000},
    4:{multiplier:1.9,cost:2500},
    5:{multiplier:2.3,cost:6000},
    6:{multiplier:2.7,cost:15000},
    7:{multiplier:3.1,cost:40000},
    8:{multiplier:3.5,cost:100000},
    9:{multiplier:3.9,cost:250000},
    10:{multiplier:4.3,cost:700000}
  };

  function load(){
    try{
      const saved=localStorage.getItem(KEY);
      return saved ? Object.assign({},DEFAULT,JSON.parse(saved)) : Object.assign({},DEFAULT);
    }catch(e){
      return Object.assign({},DEFAULT);
    }
  }

  let state=load();

  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  }

  function brush(){
    return BRUSH[state.brushLevel] || BRUSH[1];
  }

  function reward(image){
    return Math.floor(image.baseReward*brush().multiplier);
  }

  function upgrade(){
    const next=state.brushLevel+1;
    if(!BRUSH[next]){
      alert("Brush is already at MAX level.");
      return;
    }

    const cost=BRUSH[next].cost;

    if(state.coins<cost){
      alert("You need "+cost.toLocaleString()+" Coins.");
      return;
    }

    state.coins-=cost;
    state.brushLevel=next;
    save();
    render();
  }

  function complete(id){
    const image=IMAGES.find(function(x){return x.id===id;});
    if(!image || state.completedImages.indexOf(id)!==-1)return;

    const coins=reward(image);
    state.coins+=coins;
    state.completedImages.push(id);
    state.playerLevel=Math.min(100,state.completedImages.length+1);

    save();
    render();

    alert("Image completed!\\n\\n+"+coins.toLocaleString()+" Coins");
  }

  function numbers(count){
    let out="";
    const max=Math.min(count,35);
    for(let i=1;i<=max;i++) out+="<span>"+i+"</span>";
    return out;
  }

  function render(){
    const app=document.getElementById("app");
    const b=brush();
    const next=BRUSH[state.brushLevel+1];

    app.innerHTML=
      '<main class="game">'+
        '<header class="header">'+
          '<div><h1>Color by Number</h1><p>Find every number, complete the picture and earn Coins.</p></div>'+
          '<div class="coins">🪙 '+state.coins.toLocaleString()+'</div>'+
        '</header>'+

        '<section class="stats">'+
          '<div class="stat"><span>Player Level</span><strong>'+state.playerLevel+'</strong></div>'+
          '<div class="stat"><span>Brush Level</span><strong>'+state.brushLevel+'</strong></div>'+
          '<div class="stat"><span>Reward Multiplier</span><strong>×'+b.multiplier.toFixed(1)+'</strong></div>'+
        '</section>'+

        '<section class="brush">'+
          '<div class="brush-icon">🖌️</div>'+
          '<div class="brush-content">'+
            '<h2>Brush Level '+state.brushLevel+'</h2>'+
            '<p>All eligible rewards are multiplied by <strong>×'+b.multiplier.toFixed(1)+'</strong>.</p>'+
            (next
              ? '<button class="upgrade" id="upgrade">Upgrade · '+next.cost.toLocaleString()+' 🪙</button>'
              : '<strong>MAX LEVEL</strong>')+
          '</div>'+
        '</section>'+

        '<h2 class="title">Pictures</h2>'+
        '<section class="grid">'+
          IMAGES.map(function(image){
            const done=state.completedImages.indexOf(image.id)!==-1;
            return '<article class="card">'+
              '<div class="preview"><div class="numbers">'+numbers(image.colors)+'</div></div>'+
              '<h3>'+image.name+'</h3>'+
              '<p>Stage '+image.stage+' · '+image.colors+' colors</p>'+
              (done
                ? '<div class="done">✓ Completed</div>'
                : '<div class="reward">🪙 '+reward(image).toLocaleString()+'</div><button class="complete" data-id="'+image.id+'">Complete Image</button>')+
            '</article>';
          }).join("")+
        '</section>'+
        '<footer class="footer">Color by Number · Prototype</footer>'+
      '</main>';

    const upgradeButton=document.getElementById("upgrade");
    if(upgradeButton) upgradeButton.onclick=upgrade;

    document.querySelectorAll(".complete").forEach(function(button){
      button.onclick=function(){complete(Number(button.dataset.id));};
    });
  }

  render();
})();
</script>
</body>
</html>
