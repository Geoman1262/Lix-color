<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lix Color</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef5ff;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;cursor:pointer}.app{max-width:820px;margin:auto;padding:14px}
.top{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}.brand{font-size:27px;font-weight:950}.coins{background:#fff;border:1px solid #d9e3ef;border-radius:18px;padding:9px 13px;font-weight:900}
.player{grid-column:1/-1;background:#fff;border:1px solid #d9e3ef;border-radius:16px;padding:10px 12px;display:flex;gap:12px;align-items:center;justify-content:space-between}.xp{height:7px;background:#e5edf6;border-radius:8px;overflow:hidden;margin-top:5px}.xp i{display:block;height:100%;background:#172033}
.brushBtn{grid-column:1/-1;border:1px solid #d9e3ef;background:#fff;border-radius:15px;padding:11px 13px;text-align:left;font-weight:900}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tab{border:1px solid #d5dfeb;background:#fff;border-radius:14px;padding:12px 6px;font-weight:900}.tab.active{background:#172033;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid #dbe4ef;border-radius:17px;overflow:hidden;min-width:0}.thumb{aspect-ratio:1;position:relative;background:#f6f8fb;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.card.locked .thumb img{opacity:.62}.lock{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;text-shadow:0 2px 5px #fff}.badge{position:absolute;top:6px;left:6px;background:#fff;border:1px solid #dbe4ef;border-radius:9px;padding:4px 6px;font-weight:900;font-size:10px}.meta{padding:8px 9px 5px}.title{font-weight:950;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:#667389;margin-top:3px;min-height:27px}.cardBtn{width:calc(100% - 14px);margin:0 7px 7px;border:0;border-radius:11px;padding:9px 4px;font-weight:950;background:#e6edf6;color:#172033;font-size:12px}.cardBtn.open{background:#172033;color:#fff}
.overlay{position:fixed;inset:0;background:#081020aa;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal{background:#fff;border-radius:20px;width:min(700px,100%);max-height:92vh;overflow:auto;padding:16px}.modalHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.close{border:0;background:#edf2f7;border-radius:11px;padding:9px 12px;font-weight:900}.levels{display:grid;gap:8px;margin-top:10px}.level{border:1px solid #dbe4ef;border-radius:14px;padding:11px;display:flex;justify-content:space-between;align-items:center}.level.locked{opacity:.52}.level button{border:0;background:#172033;color:#fff;border-radius:10px;padding:8px 10px;font-weight:900}
.gameHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.back{border:1px solid #dbe4ef;background:#fff;border-radius:11px;padding:9px 12px;font-weight:900}.count{font-weight:950}
.numbar{display:flex;gap:6px;overflow:auto;padding:4px 0 10px}.num{min-width:44px;border:1px solid #d6e0ec;background:#fff;border-radius:10px;padding:7px 4px;font-weight:950}.num.active{background:#172033;color:#fff}.num.done{background:#dff5e5}
.board{background:#fff;border:1px solid #dbe4ef;border-radius:20px;padding:7px;position:relative}.board canvas{width:100%;height:auto;display:block;touch-action:manipulation;border-radius:14px}.hint{text-align:center;color:#667389;font-size:12px;padding:9px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#172033;color:#fff;border-radius:13px;padding:10px 14px;font-weight:850;display:none;z-index:100;white-space:nowrap}
@media(max-width:500px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.app{padding:10px}.brand{font-size:24px}.title{font-size:12px}.sub{font-size:9px}.cardBtn{font-size:11px}}
</style></head><body>
<div id="app" class="app"></div><div id="overlay" class="overlay"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
const PHOTOS={
  1:{title:"Cat",url:"https://upload.wikimedia.org/wikipedia/commons/a/a1/Cat_sitting.jpg",reward:60},
  2:{title:"Flower",url:"https://upload.wikimedia.org/wikipedia/commons/5/53/Flower_close-up.jpg",reward:90},
  3:{title:"Mountain Lake",url:"https://upload.wikimedia.org/wikipedia/commons/0/06/Mountain_lake_in_Switzerland.jpg",reward:120}
};
const BRUSH=[
 {l:1,m:1,u:1,c:0},{l:2,m:1.1,u:5,c:500},{l:3,m:1.5,u:12,c:2500},{l:4,m:1.9,u:19,c:7500},{l:5,m:2.3,u:26,c:20000},
 {l:6,m:2.7,u:33,c:50000},{l:7,m:3.1,u:40,c:125000},{l:8,m:3.5,u:47,c:300000},{l:9,m:3.9,u:54,c:750000},{l:10,m:4.3,u:61,c:1800000}
];
const PREMIUM=[5000,7500,10000,12500,15000,20000,25000,30000,40000,50000,60000,75000,90000,110000,135000,165000,200000,250000,300000,400000];
const S=JSON.parse(localStorage.getItem("lixColorV13")||"null")||{coins:0,stage:1,level:1,brush:1,completed:{},progress:{},premiumOpened:{},weekly:{opened:false,done:false}};
const save=()=>localStorage.setItem("lixColorV13",JSON.stringify(S)),fmt=n=>Math.round(n).toLocaleString();
function toast(m){let t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",1700)}
function head(){let b=BRUSH[S.brush-1];return `<div class="top"><div class="brand">Lix Color</div><div class="coins">🪙 ${fmt(S.coins)}</div><div class="player"><div style="flex:1"><b>Player Level ${S.level}</b><div class="xp"><i style="width:${Math.min(100,(S.stage/150)*100)}%"></i></div><small>Stage ${S.stage} / 150</small></div><div>🖌️ Lv.${S.brush}<br><small>×${b.m}</small></div></div><button class="brushBtn" id="brushBtn">🖌️ Brush Level ${S.brush} · Reward ×${b.m}<span style="float:right">Upgrade ›</span></button></div>`}
function card(cat,i){
 const p=PHOTOS[((i-1)%3)+1],key=cat+i,done=!!S.completed[key];let open=false,sub="",act="Locked";
 if(cat==="normal"){open=i<=S.stage;sub=open?(i<S.stage?"Completed":"Reward "+p.reward+" Coins"):"Complete Stage "+(i-1);act=open?"Play":"Locked"}
 if(cat==="premium"){open=!!S.premiumOpened[i];sub=S.stage<15?"Unlocks at Stage 15":open?"Unlocked · Entry "+fmt(PREMIUM[i-1]):"Entry "+fmt(PREMIUM[i-1])+" Coins";act=open?"Play":S.stage>=15?"Open":"Locked"}
 if(cat==="weekly"){open=i===1&&S.weekly.opened;sub=S.stage<30?"Unlocks at Stage 30":i===1?(open?"Opened · 3,000 Coins":"3,000 Coins to open"):"Future Week";act=open?"Play":i===1&&S.stage>=30?"Open":"Locked"}
 return `<div class="card ${open?"":"locked"}"><div class="thumb"><img src="${p.url}" alt="${p.title}">${!open?'<div class="lock">🔒</div>':""}${done?'<div class="badge">✓</div>':""}</div><div class="meta"><div class="title">${cat==="normal"?"Stage "+i:cat==="premium"?"Premium "+i:"Weekly "+i}</div><div class="sub">${sub}</div></div><button class="cardBtn ${open?"open":""}" data-cat="${cat}" data-id="${i}">${act}</button></div>`
}
function home(cat="normal"){
 let max=cat==="normal"?150:cat==="premium"?20:52,html="";for(let i=1;i<=max;i++)html+=card(cat,i);
 document.getElementById("app").innerHTML=head()+`<div class="tabs"><button class="tab ${cat==="normal"?"active":""}" data-tab="normal">Normal</button><button class="tab ${cat==="premium"?"active":""}" data-tab="premium">Premium</button><button class="tab ${cat==="weekly"?"active":""}" data-tab="weekly">Weekly</button></div><div class="grid">${html}</div>`;
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>home(b.dataset.tab));document.getElementById("brushBtn").onclick=openBrush;document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>action(b.dataset.cat,+b.dataset.id));
}
document.getElementById("app").addEventListener("click",e=>{let b=e.target.closest("[data-cat]");if(b)action(b.dataset.cat,+b.dataset.id)});
function action(cat,i){
 if(cat==="normal"){if(i>S.stage)return toast("Locked");return start("normal",i)}
 if(cat==="premium"){if(S.stage<15)return toast("Premium unlocks at Stage 15");if(!S.premiumOpened[i]){let c=PREMIUM[i-1];if(S.coins<c)return toast("Not enough Coins");S.coins-=c;S.premiumOpened[i]=true;save();home("premium");return}return start("premium",i)}
 if(S.stage<30)return toast("Weekly unlocks at Stage 30");if(i!==1)return toast("Future week is locked");if(!S.weekly.opened){if(S.coins<3000)return toast("3,000 Coins required");S.coins-=3000;S.weekly.opened=true;save()}start("weekly",1)
}
function openBrush(){
 document.getElementById("modal").innerHTML=`<div class="modalHead"><div><h2 style="margin:0">Brush Upgrade</h2><small>Multiplier affects first completion reward only.</small></div><button class="close" id="close">Close</button></div><div class="levels">${BRUSH.map(b=>`<div class="level ${S.brush<b.l?"locked":""}"><div><b>Level ${b.l}</b> · ×${b.m}<br><small>Unlock Stage ${b.u} · ${b.c?fmt(b.c)+" Coins":"Free"}</small></div><button data-buy="${b.l}">${S.brush>=b.l?"Owned":S.stage<b.u?"Locked":"Buy"}</button></div>`).join("")}</div>`;
 document.getElementById("overlay").style.display="flex";document.getElementById("close").onclick=closeModal;document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buyBrush(+b.dataset.buy));
}
function closeModal(){document.getElementById("overlay").style.display="none"}document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")closeModal()};
function buyBrush(l){let b=BRUSH[l-1];if(l<=S.brush||S.stage<b.u)return;if(S.coins<b.c)return toast("Not enough Coins");S.coins-=b.c;S.brush=l;save();closeModal();home();toast("Brush upgraded")}

/* Deterministic irregular photo regions. The image is reduced to a small canvas,
   seeds are moved toward local color centers, and pixels are assigned by a
   spatial+color distance. Final regions are irregular and follow photo edges. */
const CACHE={};
async function makePuzzle(photo){
 if(CACHE[photo.url])return CACHE[photo.url];
 const img=new Image();img.crossOrigin="anonymous";img.src=photo.url;
 await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error("image"))});
 const W=180,H=180,cv=document.createElement("canvas");cv.width=W;cv.height=H;const cx=cv.getContext("2d",{willReadFrequently:true});
 const scale=Math.max(W/img.width,H/img.height),dw=img.width*scale,dh=img.height*scale;cx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
 const pix=cx.getImageData(0,0,W,H).data, step=12, seeds=[];
 for(let y=step/2;y<H;y+=step)for(let x=step/2;x<W;x+=step){let k=(Math.floor(y)*W+Math.floor(x))*4;seeds.push({x,y,r:pix[k],g:pix[k+1],b:pix[k+2]})}
 let lab=new Int16Array(W*H);
 for(let it=0;it<2;it++){
   for(let y=0;y<H;y++)for(let x=0;x<W;x++){let k=(y*W+x)*4,pr=pix[k],pg=pix[k+1],pb=pix[k+2],best=1e20,bi=0;
     for(let j=0;j<seeds.length;j++){let q=seeds[j],dx=x-q.x,dy=y-q.y,dc=Math.abs(pr-q.r)+Math.abs(pg-q.g)+Math.abs(pb-q.b);let d=dx*dx+dy*dy*0.8+dc*dc*0.045;if(d<best){best=d;bi=j}}lab[y*W+x]=bi}
   const sum=seeds.map(()=>[0,0,0,0,0]);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let j=lab[y*W+x],k=(y*W+x)*4,q=sum[j];q[0]+=x;q[1]+=y;q[2]+=pix[k];q[3]+=pix[k+1];q[4]+=pix[k+2];q[5]=(q[5]||0)+1}
   for(let j=0;j<seeds.length;j++){let q=sum[j];if(q[5]){seeds[j].x=q[0]/q[5];seeds[j].y=q[1]/q[5];seeds[j].r=q[2]/q[5];seeds[j].g=q[3]/q[5];seeds[j].b=q[4]/q[5]}}
 }
 const regs=seeds.map((q,i)=>({i,n:0,c:`rgb(${q.r|0},${q.g|0},${q.b|0})`,pixels:[],cx:q.x,cy:q.y}));for(let y=0;y<H;y++)for(let x=0;x<W;x++)regs[lab[y*W+x]].pixels.push(y*W+x);
 const useful=regs.filter(r=>r.pixels.length>18);const palette=[];for(let r of useful){let lum=(+r.c.match(/\d+/g)[0]*.299);palette.push(r.c)}
 const nums=useful.length;useful.forEach((r,i)=>r.n=i+1);
 const puzzle={W,H,pix,lab,regions:useful,img};CACHE[photo.url]=puzzle;return puzzle;
}
function start(cat,id){const p=PHOTOS[((id-1)%3)+1];startAsync(cat,id,p)}
async function startAsync(cat,id,p){
 toast("Preparing picture…");try{let pu=await makePuzzle(p);let key=cat+id,old=S.progress[key];let done=old?.done||[];drawGame({cat,id,key,p,pu,done,current:old?.current||1});}catch(e){toast("Photo could not load");}}
function renderPhotoCanvas(pu,done,current){
 const cv=document.createElement("canvas");cv.width=pu.W;cv.height=pu.H;const ctx=cv.getContext("2d"),src=new ImageData(pu.pix,pu.W,pu.H),doneSet=new Set(done);
 const out=ctx.createImageData(pu.W,pu.H);
 // Keep the real photograph recognizable in the uncolored state.
 for(let i=0;i<pu.W*pu.H;i++){let reg=pu.regions[pu.lab[i]],k=i*4,r=src.data[k],g=src.data[k+1],b=src.data[k+2];
   if(doneSet.has(reg.i)){out.data[k]=r;out.data[k+1]=g;out.data[k+2]=b}
   else{let gray=(r*.299+g*.587+b*.114);gray=gray*.70+255*.30;out.data[k]=gray;out.data[k+1]=gray;out.data[k+2]=gray}
   out.data[k+3]=255}
 ctx.putImageData(out,0,0);
 // Visible boundaries follow the actual photo segmentation instead of floating numbers.
 ctx.strokeStyle="rgba(35,45,60,.72)";ctx.lineWidth=.7;ctx.beginPath();
 for(let y=0;y<pu.H;y++)for(let x=0;x<pu.W;x++){
   let a=pu.regions[pu.lab[y*pu.W+x]];
   if(x+1<pu.W){let b=pu.regions[pu.lab[y*pu.W+x+1]];if(a!==b){ctx.moveTo(x+1,y);ctx.lineTo(x+1,y+1)}}
   if(y+1<pu.H){let b=pu.regions[pu.lab[(y+1)*pu.W+x]];if(a!==b){ctx.moveTo(x,y+1);ctx.lineTo(x+1,y+1)}}
 }
 ctx.stroke();
 // One readable number inside each region.
 ctx.font="700 6.5px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
 for(let r of pu.regions){if(doneSet.has(r.i))continue;let x=Math.round(r.cx),y=Math.round(r.cy);ctx.fillStyle="rgba(255,255,255,.82)";ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.fillStyle="#172033";ctx.fillText(String(r.n),x,y)}
 return cv;
}
function drawGame(g){
 const remaining=g.pu.regions.filter(r=>!g.done.includes(r.i)).length,nums=[...new Set(g.pu.regions.map(r=>r.n))].sort((a,b)=>a-b);
 const ns=nums.map(n=>{let rem=g.pu.regions.filter(r=>r.n===n&&!g.done.includes(r.i)).length;return `<button class="num ${g.current===n?"active":""} ${rem===0?"done":""}" data-num="${n}">${n}<small style="display:block">${rem}</small></button>`}).join("");
 document.getElementById("app").innerHTML=`<div class="gameHead"><button class="back" id="gb">← Back</button><div class="count">${g.p.title} · ${g.pu.regions.length-remaining}/${g.pu.regions.length}</div><div class="coins">🪙 ${fmt(S.coins)}</div></div><div class="numbar">${ns}</div><div class="board"><div id="boardCanvas"></div></div><div class="hint">Number ${g.current}: tap matching regions. Progress saves automatically.</div>`;
 const board=document.getElementById("boardCanvas"),cv=renderPhotoCanvas(g.pu,g.done,g.current);board.appendChild(cv);
 cv.addEventListener("click",e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*g.pu.W/r.width,y=(e.clientY-r.top)*g.pu.H/r.height,idx=Math.max(0,Math.min(g.pu.W-1,Math.floor(x)))+Math.max(0,Math.min(g.pu.H-1,Math.floor(y)))*g.pu.W,reg=g.pu.regions[g.pu.lab[idx]];tap(g,reg.i,reg.n)});
 document.getElementById("gb").onclick=()=>{persist(g);home(g.cat)};
 document.querySelectorAll("[data-num]").forEach(b=>b.onclick=()=>{let n=+b.dataset.num;if(g.cat!=="weekly"&&n>g.current&&!g.pu.regions.filter(r=>!g.done.includes(r.i)).some(r=>r.n===g.current)){} else if(g.cat!=="weekly"&&n>g.current)return toast("Finish the current number first");g.current=n;persist(g);drawGame(g)});
}
function persist(g){S.progress[g.key]={done:g.done,current:g.current};save()}
function tap(g,idx,n){if(g.done.includes(idx))return;if(n!==g.current)return toast("Wrong number");g.done.push(idx);persist(g);let rem=g.pu.regions.filter(r=>r.n===g.current&&!g.done.includes(r.i)).length;if(rem===0&&g.cat!=="weekly"){let nx=g.pu.regions.find(r=>!g.done.includes(r.i))?.n;if(nx)g.current=nx}if(g.pu.regions.every(r=>g.done.includes(r.i))){finish(g);return}drawGame(g)}
function finish(g){
 let first=!S.completed[g.key],gain=0,m=BRUSH[S.brush-1].m;
 if(g.cat==="normal"){gain=first?Math.round(g.p.reward*m):Math.round(g.p.reward*.02)}
 else if(g.cat==="premium"){if(!first)return;let e=PREMIUM[g.id-1],bonus=e*.2;gain=e+Math.round(bonus*m)}
 else if(g.cat==="weekly"){if(!first)return;gain=Math.round(4000*m);S.weekly.opened=false}
 S.coins+=gain;S.completed[g.key]=true;delete S.progress[g.key];if(g.cat==="normal"&&g.id===S.stage)S.stage=Math.min(150,S.stage+1);S.level=Math.max(1,Math.floor((S.stage-1)/5)+1);save();home(g.cat);toast("Completed! +"+fmt(gain)+" Coins")}
home();
</script></body></html>
