<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lix Color — Color Number Prototype</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4ff;color:#172033;font-family:Arial,sans-serif}
header{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:28px}
.coins{background:#fff;border:1px solid #dce3ef;border-radius:28px;padding:12px 18px;font-weight:800}
.wrap{max-width:720px;margin:auto;padding:10px 18px 30px}
.card{background:#fff;border:1px solid #dce3ef;border-radius:22px;padding:18px;box-shadow:0 2px 10px #0000000b}
.title{font-size:22px;font-weight:800;margin-bottom:5px}
.sub{color:#6c7482;margin-bottom:14px}
.photo{position:relative;width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#fff;touch-action:manipulation}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(1.55)}
#grid{position:absolute;inset:0;display:grid}
.cell{position:relative;border:1px solid #b7bcc5;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;color:#303746;font-size:clamp(8px,2.4vw,15px);user-select:none}
.cell.done{border-color:rgba(255,255,255,.12);color:transparent}
.cell.wrong{animation:shake .18s linear 2;background:#ffdede}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.nums{display:flex;gap:7px;overflow-x:auto;padding:12px 0 3px}
.num{min-width:48px;height:48px;border-radius:13px;border:1px solid #d5ddea;background:#fff;font-weight:900;font-size:18px}
.num.active{background:#172033;color:#fff}
.num.done{background:#dff5e7;color:#16803c}
.info{text-align:center;color:#667085;padding:10px 0}
button.play{width:100%;border:0;border-radius:15px;padding:16px;background:#172033;color:#fff;font-size:18px;font-weight:900}
#game{display:none}
#complete{display:none;text-align:center;padding:22px;font-size:22px;font-weight:900}
.legend{display:flex;gap:6px;align-items:center;justify-content:center;color:#667085;font-size:13px}
.dot{width:14px;height:14px;border-radius:4px;border:1px solid #aaa}
</style>
</head>

    <div class="info" id="info">Number 1: tap every matching square.</div>
    <div id="complete">🎉 Picture complete!</div>
  </div>
</div>

<script>
const ROWS=24,COLS=24,TOTAL=ROWS*COLS,GROUPS=12;
const COLORS=["#F7F7F2", "#D9D9D2", "#A9A9A2", "#6F6F68", "#3D3D39", "#8A7768", "#6B5A4A", "#B9A48D", "#C9BFAE", "#4E6652", "#788B72", "#252822"];
const grid=document.getElementById('grid'), nums=document.getElementById('nums');
let current=1, done=0, cells=[];

// Each number is a COLOR. Every cell with the same number has exactly
// the same target color. Spatial placement is independent of the color.
function colorGroup(r,c){
  // deterministic color zones with enough variation to resemble a photo mosaic
  const v = (Math.sin(r*0.63)+Math.cos(c*0.71)+Math.sin((r+c)*0.31))*3
          + (r%5)*0.7 + (c%7)*0.35;
  return Math.max(1, Math.min(GROUPS, Math.floor(((v+10)/20)*GROUPS)+1));
}

function build(){
  grid.style.gridTemplateColumns=`repeat(${COLS},1fr)`;
  grid.style.gridTemplateRows=`repeat(${ROWS},1fr)`;
  nums.innerHTML='';
  for(let n=1;n<=GROUPS;n++){
    const b=document.createElement('button');
    b.className='num'+(n===1?' active':'');
    b.textContent=n;
    b.onclick=()=>select(n);
    b.id='n'+n;
    nums.appendChild(b);
  }
  grid.innerHTML=''; cells=[]; done=0; current=1;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const el=document.createElement('div');
    el.className='cell';
    const g=colorGroup(r,c);
    el.textContent=g;
    el.dataset.group=g;
    el.onclick=()=>paint(el);
    grid.appendChild(el); cells.push(el);
  }
  updateLegend();
}

function updateLegend(){
  document.getElementById('legendDot').style.background=COLORS[current-1];
}

function select(n){
  current=n;
  document.querySelectorAll('.num').forEach(x=>x.classList.toggle('active',+x.textContent===n));
  document.getElementById('info').textContent=`Number ${n}: tap every square with number ${n}. All ${n} squares become the same color.`;
  updateLegend();
}

function paint(el){
  if(el.classList.contains('done')) return;
  if(+el.dataset.group===current){
    el.classList.add('done');
    el.style.background=COLORS[current-1];
    el.style.borderColor=COLORS[current-1];
    el.textContent='';
    done++;
    document.getElementById('count').textContent=`${done} / ${TOTAL}`;
    const remaining=cells.filter(x=>!x.classList.contains('done') && +x.dataset.group===current).length;
    document.getElementById('n'+current).classList.toggle('done',remaining===0);
    if(remaining===0){
      const next=[...Array(GROUPS)].map((_,i)=>i+1).find(n=>cells.some(x=>!x.classList.contains('done')&&+x.dataset.group===n));
      if(next) select(next); else finish();
    }
  } else {
    el.classList.add('wrong');
    setTimeout(()=>el.classList.remove('wrong'),450);
  }
}

function finish(){
  document.getElementById('info').textContent='All squares colored.';
  document.getElementById('complete').style.display='block';
}

document.getElementById('play').onclick=()=>{
  document.getElementById('home').style.display='none';
  document.getElementById('game').style.display='block';
  build();
};
document.getElementById('back').onclick=()=>{
  document.getElementById('game').style.display='none';
  document.getElementById('home').style.display='block';
};
</script>
</body>
